<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Energy Deals</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f4f6;
color:#111827;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
max-width:560px;
margin:auto;
min-height:100vh;
background:#f7f8fa
}

.hero{
background:#111827;
color:#fff;
padding:22px 18px 20px;
border-radius:0 0 28px 28px
}

.top{
display:flex;
justify-content:space-between;
align-items:center
}

.brand{
font-size:14px;
font-weight:900;
letter-spacing:.08em
}

.loc{
background:#273244;
color:#fff;
border:0;
border-radius:12px;
padding:9px 11px;
text-decoration:none
}

.headline{
font-size:29px;
line-height:1.08;
font-weight:900;
margin:20px 0 6px
}

.sub{
font-size:13px;
opacity:.7
}

.search{
margin-top:17px;
background:#fff;
color:#6b7280;
border-radius:15px;
display:flex;
align-items:center;
padding:0 13px
}

.search input{
width:100%;
border:0;
outline:0;
padding:14px 9px;
font-size:16px
}

.tabs{
display:flex;
gap:8px;
overflow:auto;
padding:14px 18px 5px
}

.chip{
border:0;
background:#fff;
padding:9px 13px;
border-radius:999px;
white-space:nowrap;
text-decoration:none;
color:#111827;
cursor:pointer
}

.chip.on{
background:#111827;
color:#fff
}

.controls{
display:flex;
gap:8px;
padding:10px 18px 5px
}

select{
flex:1;
border:0;
background:#fff;
border-radius:12px;
padding:11px;
font-size:13px;
color:#111827
}

main{
padding:8px 18px 35px
}

.status{
margin:12px 0;
background:#fff;
border-radius:15px;
padding:13px;
font-size:12px;
color:#4b5563
}

.card{
background:#fff;
border-radius:18px;
padding:16px;
margin:10px 0;
box-shadow:0 3px 14px #0000000b
}

.line{
display:flex;
justify-content:space-between;
gap:10px
}

.product{
font-size:17px;
font-weight:850
}

.brandtxt,.meta{
font-size:12px;
color:#6b7280;
margin-top:3px
}

.badge{
background:#ecfdf5;
color:#047857;
font-size:10px;
font-weight:900;
padding:6px 8px;
border-radius:9px;
height:max-content
}

.store{
font-weight:750;
font-size:13px;
margin-top:13px
}

.distance{
font-size:12px;
color:#6b7280;
font-weight:500
}

.bottom{
display:flex;
justify-content:space-between;
align-items:end;
margin-top:13px
}

.price{
font-size:25px;
font-weight:900
}

.unit{
font-size:11px;
color:#6b7280
}

.btn{
display:inline-block;
border:0;
background:#f1f3f5;
border-radius:11px;
padding:9px 10px;
text-decoration:none;
color:#111827
}

.empty{
background:#fff;
border-radius:18px;
padding:25px;
text-align:center;
color:#6b7280;
margin-top:10px
}

.note{
font-size:10.5px;
line-height:1.45;
color:#9ca3af;
margin-top:16px
}
</style>
</head>

<body>

<div class="app">

<header class="hero">

<div class="top">
<div class="brand">⚡ ENERGY DEALS</div>
<a class="loc" href="location.html">📍 59821</a>
</div>

<div class="headline">
Dein Energy.<br>
Dein bester Preis.
</div>

<div class="sub">
Aktuelle Energy-Drink-Angebote in deiner Nähe
</div>

<div class="search">
🔎
<input
type="search"
id="search"
placeholder="Energy Drink, Marke oder Händler..."
>
</div>

</header>

<nav class="tabs">

<button class="chip on" data-brand="Alle">Alle</button>
<button class="chip" data-brand="Red Bull">Red Bull</button>
<button class="chip" data-brand="Monster">Monster</button>
<button class="chip" data-brand="Rockstar">Rockstar</button>
<button class="chip" data-brand="GÖNRGY">GÖNRGY</button>
<button class="chip" data-brand="Carabao">Carabao</button>

</nav>

<div class="controls">

<select id="storeFilter">
<option value="Alle">Alle Händler</option>
<option value="Kaufland">Kaufland</option>
<option value="Lidl">Lidl</option>
<option value="EDEKA">EDEKA</option>
<option value="Penny">Penny</option>
<option value="REWE">REWE</option>
<option value="Netto">Netto</option>
</select>

<select id="sort">
<option value="price">Günstigster Preis</option>
<option value="liter">Günstigster €/Liter</option>
</select>

</div>

<main>

<div class="status">
📍 <b>59821 Arnsberg</b> · Radius 10 km ·
<span id="count">6</span> Angebote
</div>

<div id="deals"></div>

<div class="note">
Demo-Daten. Die Angebote dienen aktuell nur zur Demonstration der Funktionen.
</div>

</main>

</div>

<script>

let deals = [];


fetch("deals.json")
  .then(response => response.json())
  .then(data => {
    deals = data;
    render();
  })
  .catch(error => {
    console.error("Fehler beim Laden der Angebote:", error);

    
  });const dealsContainer=document.getElementById("deals");
const search=document.getElementById("search");
const storeFilter=document.getElementById("storeFilter");
const sort=document.getElementById("sort");
const count=document.getElementById("count");

let selectedBrand="Alle";

function render(){

let filtered=[...deals];

const searchText=search.value.toLowerCase().trim();

if(selectedBrand!=="Alle"){
filtered=filtered.filter(deal=>deal.brand===selectedBrand);
}

if(storeFilter.value!=="Alle"){
filtered=filtered.filter(deal=>deal.store===storeFilter.value);
}

if(searchText){
filtered=filtered.filter(deal=>
deal.product.toLowerCase().includes(searchText) ||
deal.brand.toLowerCase().includes(searchText) ||
deal.store.toLowerCase().includes(searchText)
);
}

if(sort.value==="price"){
filtered.sort((a,b)=>a.price-b.price);
}

if(sort.value==="liter"){
filtered.sort((a,b)=>
(a.price/(a.size/1000))-
(b.price/(b.size/1000))
);
}

count.textContent=filtered.length;

dealsContainer.innerHTML="";

if(filtered.length===0){

dealsContainer.innerHTML=`
<div class="empty">
🔎<br><br>
<b>Keine Angebote gefunden.</b><br>
Versuche einen anderen Suchbegriff oder Filter.
</div>
`;

return;

}

filtered.forEach((deal,index)=>{

const literPrice=deal.price/(deal.size/1000);

const card=document.createElement("article");

card.className="card";

card.innerHTML=`

<div class="line">

<div>

<div class="product">
${deal.product}
</div>

<div class="brandtxt">
${deal.brand} · ${deal.size} ml
</div>

</div>

${index===0 && sort.value==="price"
? `<span class="badge">BESTER PREIS</span>`
: ""}

</div>

<div class="store">
🏪 ${deal.store}
<span class="distance">· ${deal.distance}</span>
</div>

<div class="meta">
📅 ${deal.date}
</div>

<div class="bottom">

<div>

<div class="price">
${deal.price.toFixed(2).replace(".",",")} €
</div>

<div class="unit">
${literPrice.toFixed(2).replace(".",",")} €/Liter
</div>

</div>

<div>

<a class="btn" href="${deal.link}">
♡
</a>

<a class="btn" href="${deal.link}">
↗
</a>

</div>

</div>

`;

dealsContainer.appendChild(card);

});

}

document.querySelectorAll(".chip").forEach(button=>{

button.addEventListener("click",()=>{

document.querySelectorAll(".chip")
.forEach(b=>b.classList.remove("on"));

button.classList.add("on");

selectedBrand=button.dataset.brand;

render();

});

});

search.addEventListener("input",render);
storeFilter.addEventListener("change",render);
sort.addEventListener("change",render);



</script>

</body>
</html>
